# docker-compose do app Umbrel bmfernandes-dev-audit. Auditoria independente (herdada da
# TASK_V40/TASK_V46 do llm-gateway) + verificação de integridade do host (classe H1),
# rodando 24h no Beelink, nunca na máquina de dev. Projeto extraído do llm-gateway
# (2026-10-05) — o app Umbrel em si é o MESMO (`bmfernandes-dev-audit`), só o repositório
# de origem mudou.
#
# SEM app_proxy / porta publicada: este app não tem UI (dashboard de indicadores é tarefa
# futura) — nada a expor ao app_proxy do Umbrel por ora.
#
# ACHADO EMPÍRICO (validação local, 2026-10-04, llm-gateway — ver P2 do contrato original):
# usuário não-root com GID `0` (grupo `root`) lê o sudoers `0440 root:root` via permissão
# de GRUPO comum do Unix, sem nenhuma capability — zero `cap_add`, `cap_drop: ALL` em
# todos os serviços.

networks:
  default: {}
  umbrel_main_network:
    external: true

services:
  runner:
    # Imagem publicada, nunca `build:` — o app instalado no Umbrel vive em
    # `~/umbrel/app-data/<app_id>/` e NÃO tem o código-fonte/Dockerfile, então `build:`
    # local não é o fluxo natural do Umbrel (build local, pra teste, é
    # `docker build -f umbrel/Dockerfile .` manual).
    image: 127.0.0.1:8801/dev-audit@sha256:d46a5596660ba67d1d97d0932b830ee7cd059eb6a0c9dd696b136cac55a3b93a
    # Sobrevive a reboot/crash sem intervenção manual — o agendamento de verdade (próximo
    # horário + jitter) é interno ao próprio processo (app_runner.py), não deste restart
    # policy, que só cobre "o container caiu, suba de novo".
    restart: unless-stopped
    # Usuário não-root (UID arbitrário, não precisa existir em /etc/passwd de lado nenhum
    # — numérico basta) + GID 0 (grupo root) é suficiente pra ler o sudoers 0440 via
    # permissão de grupo Unix comum. Testado e confirmado local: zero capabilities, zero
    # setcap, zero binário extra.
    user: "1000:0"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # Estritamente somente-leitura sobre o host — filesystem do container travado; só os
    # volumes abaixo (explicitamente read-write onde o PRÓPRIO app escreve: o mirror git
    # e o diretório de relatório) permitem escrita.
    read_only: true
    tmpfs:
      - /tmp
    # Prioridade baixa explícita (achado real 2026-10-02/03, llm-gateway — bitcoind do
    # mesmo Beelink saturou a máquina, 670% CPU/46% RAM, travou 18 updates de apps em 1%).
    cpus: "0.50"
    mem_limit: 256m
    environment:
      - AUDIT_GATEWAY_URL=${AUDIT_GATEWAY_URL:-http://bmfernandes-llm-gateway_web_1:8800}
      - NTFY_TOPIC=${NTFY_TOPIC:-bmfernandes-auditoria}
      # PLACEHOLDER (ver app_runner.py): só llm-gateway, só host_integrity. O loop real de
      # N projetos a partir de projetos.yml e o pipeline completo de triagem/confirmação
      # (D0-D6) ainda não existem em código — sync/report_store/recovery já estão
      # implementados e ligados, mas só pra este 1 projeto.
      - AUDIT_PROJETO_NOME=llm-gateway
      - AUDIT_MIRROR_BASE_DIR=/app/projetos
      - AUDIT_REPORT_BASE_DIR=/audit-reports
      # Deploy key de leitura dedicada — a URL em si não é segredo, mas a autenticação SSH
      # (qual chave usar) é configuração de ambiente, lida por `sync.py` via
      # `GIT_SSH_COMMAND`. A chave em si vem de ${APP_DATA_DIR}/deploy-keys (ro, abaixo),
      # nome fixo = nome do projeto.
      - AUDIT_LLM_GATEWAY_REMOTE_URL=${AUDIT_LLM_GATEWAY_REMOTE_URL:-git@github.com:bmfernandes/llm-gateway.git}
      - AUDIT_LLM_GATEWAY_DEPLOY_KEY_PATH=/app/deploy-keys/llm-gateway
      - AUDIT_LLM_GATEWAY_UMBREL_APP_YML=/host-artifacts/llm-gateway-umbrel-app.yml
    volumes:
      # --- Inventário e mirrors de leitura (dentro do app-data: re-clonável) ---
      # PRÉ-REQUISITO DE HOST: precisa existir com grupo `root` (GID 0) e `0775` — `git
      # fetch`/`merge` escreve dentro de `.git/` do mirror. Aplicado pelo wrapper
      # `bmfernandes-dev-audit-fix-perms.sh` (umbrel/net-bootstrap/deploy-privs/).
      - ${APP_DATA_DIR}/projetos.yml:/app/projetos.yml:ro
      - ${APP_DATA_DIR}/projetos:/app/projetos
      # Deploy keys de leitura, uma por projeto inscrito — read-only, nunca escrita
      # (nenhuma credencial de escrita existe do lado Beelink).
      - ${APP_DATA_DIR}/deploy-keys:/app/deploy-keys:ro

      # --- Relatório: FORA do app-data, direto no host, por projeto ---
      # PRÉ-REQUISITO DE HOST: este diretório (e `${APP_DATA_DIR}/projetos/<slug>/mirror/`,
      # que git fetch/merge também escreve) precisa existir com grupo `root` (GID 0) e bit
      # de escrita de grupo (`0775`) — GID 0 é o domínio de privilégio deste app em leitura
      # (sudoers) E escrita (relatório/mirror). Sem isso, `PermissionError` na primeira
      # escrita/no primeiro `git fetch`.
      - /home/umbrel/audit-reports:/audit-reports

      # --- host_integrity: artefatos reais do host (do llm-gateway, projeto auditado), somente-leitura ---
      # Mesmo path dentro e fora do container — `host_integrity.ARTEFATOS_LLM_GATEWAY` tem
      # os caminhos host hardcoded, então o container precisa vê-los no MESMO lugar.
      - /etc/sudoers.d/umbrel-llm-gateway-deploy:/etc/sudoers.d/umbrel-llm-gateway-deploy:ro
      - /opt/llm-gateway/bin:/opt/llm-gateway/bin:ro
      # Versão DE FATO implantada do llm-gateway — lê `version:` do manifesto já copiado
      # pro app-data dele, nunca o `HEAD` do branch padrão.
      - /home/umbrel/umbrel/app-data/bmfernandes-llm-gateway/umbrel-app.yml:/host-artifacts/llm-gateway-umbrel-app.yml:ro
    networks:
      - default
      - umbrel_main_network

  # Deploy sem senha: reaplica os scripts fixos em /opt/bmfernandes-dev-audit/bin e a
  # regra de /etc/sudoers.d/bmfernandes-dev-audit-deploy a cada boot. Mecanismo próprio,
  # independente do llm-gateway (mesmo padrão, TASK_V44 Fase 4 daquele repo —
  # reconstruído aqui porque este projeto nasceu extraído dele, 2026-10-05). Bind-mount de
  # DIRETÓRIO inteiro (nunca arquivo único — achado real do llm-gateway, TASK_V27:
  # `rename()` sobre bind-mount de arquivo único dá `EBUSY`) dispensa `nsenter -m` por
  # completo.
  deploy_privs_bootstrap:
    # fixação por digest é especialmente relevante aqui: sem ela, quem publica esta tag
    # determina o conteúdo de /etc/sudoers.d/ do host na próxima subida.
    image: 127.0.0.1:8801/dev-audit-net-bootstrap-deploy-privs@sha256:0c921bf03a29f4f82ab33760868436cdeb1921d6d34fdf96c906c731ff30fd6f
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: "no"
    volumes:
      - /etc/sudoers.d:/etc/sudoers.d
      - /opt/bmfernandes-dev-audit/bin:/opt/bmfernandes-dev-audit/bin
