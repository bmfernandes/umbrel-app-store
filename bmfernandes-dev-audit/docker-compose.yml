# docker-compose do app Umbrel bmfernandes-dev-audit. Auditoria independente (herdada da
# TASK_V40/TASK_V46 do llm-gateway, hoje TASK_V01/TASK_V02 deste repo), rodando 24h no Beelink, nunca na máquina de dev. Projeto extraído do llm-gateway
# (2026-10-05) — o app Umbrel em si é o MESMO (`bmfernandes-dev-audit`), só o repositório
# de origem mudou.
#
# UI (TASK_V04 e TASK_V08): serviço `ui` com o dashboard aberto de indicadores e a área de
# configurações com senha própria, exposto pelo proxy do Umbrel (bloco `app_proxy` abaixo, sem
# login do Umbrel). Só o volume `cadastro` é gravável; nenhuma chave de projeto, nenhum acesso a
# git ou rede.
#
# Zero `cap_add` e `cap_drop: ALL` em todos os serviços. O container é o limite do processo:
# o runner só lê do host o cadastro (somente leitura) e só escreve no relatório e no espelho git.

networks:
  default: {}
  umbrel_main_network:
    external: true

services:
  runner:
    # Imagem publicada, nunca `build:` — o app instalado no Umbrel vive em
    # `~/umbrel/app-data/<app_id>/` e NÃO tem o código-fonte/Dockerfile, então `build:`
    # local não é o fluxo natural do Umbrel (build local, pra teste, é
    # `docker build -f umbrel/Dockerfile .` manual).
    image: 127.0.0.1:8801/dev-audit@sha256:60c80a3ec68072eb1ae256a3776020ab3e020dcc912a48bcd770afd61f7b9263
    # Sobrevive a reboot/crash sem intervenção manual — o agendamento de verdade (próximo
    # horário + jitter) é interno ao próprio processo (app_runner.py), não deste restart
    # policy, que só cobre "o container caiu, suba de novo".
    restart: unless-stopped
    # Usuário não-root (UID arbitrário, não precisa existir em /etc/passwd de lado nenhum
    # — numérico basta) + GID 0 (grupo root): o grupo que dá escrita ao volume do relatório e
    # ao mirror (`0775`). Zero capabilities, zero setcap, zero binário extra.
    user: "1000:0"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # Filesystem do container travado; só os volumes abaixo (explicitamente read-write onde o
    # PRÓPRIO app escreve: o mirror git e o diretório de relatório) permitem escrita.
    read_only: true
    tmpfs:
      - /tmp
    # Prioridade baixa explícita (achado real 2026-10-02/03, llm-gateway — bitcoind do
    # mesmo Beelink saturou a máquina, 670% CPU/46% RAM, travou 18 updates de apps em 1%).
    cpus: "0.50"
    mem_limit: 256m
    # A credencial DEDICADA do pipeline no Gateway não vem por variável de ambiente nem por
    # `env_file`: o runner a lê a cada ciclo do `cadastro.json` do volume `/app/cadastro`
    # (Emenda V08-1). Ausente ou inválida = o runner registra `credencial_ausente` e pula o
    # pipeline (nunca cai para a credencial genérica).
    environment:
      - AUDIT_GATEWAY_URL=${AUDIT_GATEWAY_URL:-http://bmfernandes-llm-gateway_web_1:8800}
      - NTFY_TOPIC=${NTFY_TOPIC:-bmfernandes-auditoria}
      # O runner itera os projetos de /app/projetos.yml (dentro da imagem) e roda o pipeline
      # D0-D6 (TASK_V05). Nada de um projeto específico no compose.
      - AUDIT_MIRROR_BASE_DIR=/app/projetos
      - AUDIT_REPORT_BASE_DIR=/audit-reports
      # Parametrização da cadência (variável que o código já lê): 600 s de espera depois de cada
      # ciclo, que tem prazo próprio de 10 min (`AUDIT_DEADLINE_MINUTOS`): roda, descansa, roda.
      - AUDIT_INTERVALO_TESTE_SEGUNDOS=600
    volumes:
      # --- Inventário e mirrors de leitura (dentro do app-data: re-clonável) ---
      # PRÉ-REQUISITO DE HOST: precisa existir com grupo `root` (GID 0) e `0775` — `git
      # fetch`/`merge` escreve dentro de `.git/` do mirror. Aplicado pelo wrapper
      # `bmfernandes-dev-audit-fix-perms.sh` (umbrel/net-bootstrap/deploy-privs/).
      - ${APP_DATA_DIR}/projetos:/app/projetos
      # Deploy keys de leitura, uma por projeto inscrito — read-only, nunca escrita
      # (nenhuma credencial de escrita existe do lado Beelink).
      - ${APP_DATA_DIR}/deploy-keys:/app/deploy-keys:ro
      # Cadastro (credencial do Gateway), somente leitura: pasta real do host, que sobrevive à
      # recriação do container. PRÉ-REQUISITO DE HOST: a pasta é criada antes, dono `umbrel`,
      # modo 0700, com o `cadastro.json` em 0600 (se o Docker a criar, nasce `root:root`).
      - ${APP_DATA_DIR}/cadastro:/app/cadastro:ro

      # --- Relatório: o volume que o processo escreve, além do espelho git dos projetos (o container é o limite) ---
      # Os artefatos que o processo escreve (AUDIT_STATE.md e audit_state.json) entram como
      # volume mapeado; além dele, o processo só lê o cadastro (volume acima, somente leitura).
      # PRÉ-REQUISITO DE HOST: este diretório (e `${APP_DATA_DIR}/projetos/<slug>/mirror/`,
      # que git fetch/merge também escreve) precisa existir com grupo `root` (GID 0) e bit
      # de escrita de grupo (`0775`). Sem isso, `PermissionError` na primeira escrita/no
      # primeiro `git fetch`.
      - /home/umbrel/audit-reports:/audit-reports
    networks:
      - default
      - umbrel_main_network

  # Dashboard aberto (TASK_V04) e área de configurações com senha (TASK_V08). Mesma imagem do
  # runner (um digest, uma publicação) com o `entrypoint` trocado para o uvicorn; processo único
  # (`--workers 1`, sessão e limitador em memória). Nas redes `default` e `umbrel_main_network`,
  # como o `runner` e o `web` do llm-gateway (decisão P3: rede compartilhada). O relatório e o
  # mirror entram somente leitura (V04 A-3); só o `cadastro` é gravável.
  ui:
    image: 127.0.0.1:8801/dev-audit@sha256:60c80a3ec68072eb1ae256a3776020ab3e020dcc912a48bcd770afd61f7b9263
    entrypoint:
      - python3
      - -m
      - uvicorn
      - ui_app:app
      - --host
      - 0.0.0.0
      - --port
      - "8005"
      - --workers
      - "1"
    restart: unless-stopped
    user: "1000:0"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    cpus: "0.25"
    mem_limit: 128m
    environment:
      - AUDIT_MIRROR_BASE_DIR=/app/projetos
      - AUDIT_REPORT_BASE_DIR=/audit-reports
    volumes:
      - ${APP_DATA_DIR}/projetos:/app/projetos:ro
      - /home/umbrel/audit-reports:/audit-reports:ro
      # Cadastro com escrita (TASK_V08, Fatia 3): único volume gravável da `ui`, onde a área de
      # configurações edita a credencial do Gateway e guarda o hash da senha (`ui_senha.json`).
      # O `runner` o monta `:ro`. PRÉ-REQUISITO DE HOST: pasta dono `umbrel` (uid 1000), modo 0700.
      - ${APP_DATA_DIR}/cadastro:/app/cadastro
    # A imagem não tem curl nem wget: o healthcheck usa o próprio Python.
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8005/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - default
      - umbrel_main_network

  # Proxy do Umbrel: nesta versão do umbrelOS o `app-script` remove este serviço do compose que
  # executa e grava estas variáveis em `app-gateway.json`; o proxy em si é o `umbreld`, no host.
  # APP_HOST = <id-completo-do-app>_<serviço>_1; sem login do Umbrel (PROXY_AUTH_ADD "false").
  app_proxy:
    environment:
      APP_HOST: bmfernandes-dev-audit_ui_1
      APP_PORT: 8005
      PROXY_AUTH_ADD: "false"

  # Deploy sem senha: reaplica os scripts fixos em /opt/bmfernandes-dev-audit/bin e a
  # regra de /etc/sudoers.d/bmfernandes-dev-audit-deploy a cada boot. Mecanismo próprio,
  # independente do llm-gateway (mesmo padrão, TASK_V44 Fase 4 daquele repo —
  # reconstruído aqui porque este projeto nasceu extraído dele, 2026-10-05). Bind-mount de
  # DIRETÓRIO inteiro (nunca arquivo único — achado real do llm-gateway, TASK_V27:
  # `rename()` sobre bind-mount de arquivo único dá `EBUSY`) dispensa `nsenter -m` por
  # completo.
  deploy_privs_bootstrap:
    # fixação por digest é especialmente relevante aqui: sem ela, quem publica esta tag
    # determina o conteúdo de /etc/sudoers.d/ do host na próxima subida.
    image: 127.0.0.1:8801/dev-audit-net-bootstrap-deploy-privs@sha256:88897b11f562421bc677fed02d600da03c6a91872e505dab5b1b4c3bc81b04b2
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: "no"
    volumes:
      - /etc/sudoers.d:/etc/sudoers.d
      - /opt/bmfernandes-dev-audit/bin:/opt/bmfernandes-dev-audit/bin
