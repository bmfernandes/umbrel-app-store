# Manifesto Umbrel Community App do app de auditoria independente.
# CÓPIA DE REFERÊNCIA — a fonte que o Umbrel de fato lê é o repo público
# github.com/bmfernandes/umbrel-app-store (bmfernandes-dev-audit/). Atualizar os dois em sincronia.
manifestVersion: 1
id: bmfernandes-dev-audit
name: Auditoria Independente
tagline: Verificação contínua de fidelidade task↔código
icon: https://raw.githubusercontent.com/bmfernandes/umbrel-app-store/main/bmfernandes-dev-audit/icon.svg
category: Developer Tools
version: "1.1.6"
# `port` é obrigatório no schema do manifesto (zod, AppManifestSchema) mesmo sem UI —
# este app não publica nada via app_proxy (sem serviço algum exposto no docker-compose.yml).
# Valor nominal, nunca de fato escutado por nada.
port: 8900
# Sem dashboard — path vazio (mesma convenção do app "ollama", headless, já instalado
# neste Umbrel).
path: ""
description: >-
  Auditoria independente e contínua de fidelidade entre tasks e o código commitado
  (classes D0-D6). Segue uma única linha do tempo, a dos commits, e roda 24h sem interface
  própria; o relatório é gravado em volume mapeado e publicado no repositório do projeto
  auditado pela máquina de desenvolvimento, nunca por este app.
developer: BMFERNANDES
website: https://github.com/bmfernandes/dev-audit
submitter: BMFERNANDES
repo: https://github.com/bmfernandes/dev-audit
support: https://github.com/bmfernandes/dev-audit/issues
gallery: []
releaseNotes: >-
  v1.1.6 — imagem com usuário não-root por padrão e instalação das dependências só por wheels com hashes obrigatórios. v1.1.5 — o log passa a sair em JSON estruturado (com correlation_id) e os erros tratados antes silenciosos passam a ser registrados. v1.1.4 — correções da revisão da V05: marca da rotação, cursor persistido mesmo se a notificação falhar, validação do inventário e do relatório, cursor vazio aceito até o primeiro ciclo executado. v1.1.3 — o fallback da triagem para o tier `floor` passa a vir ligado por padrão (como no
  mecanismo antigo). v1.1.2 — prazo padrão do ciclo passa de 45 para 10 minutos (fixo no código, nesta fase de
  testes). v1.1.1 — histórico de cada ciclo ganha o tempo gasto na confirmação (`tempo_confirmacao_segundos`)
  e o número de issues gravadas (`entradas_geradas`); commit só de documentação (`.md` ou `docs/`)
  deixa de gerar o aviso de commit sem task; a recuperação do relatório passa a ler de
  `docs/auditoria/` na `main` do projeto auditado, e o mirror não busca mais a branch
  `audit-reports`. v1.1.0 — liga o pipeline de fidelidade task↔código (D0-D6) ao app: o cursor de commits é a
  única linha do tempo; todo commit passa pela triagem e, se cita uma task, roda o D4 e o D5
  dela. Sem commit novo o ciclo não faz nada. Removidos a verificação de integridade do host
  (H1), a rotação periódica de tasks, a regra de espera no boot e o backlog de confirmações:
  o container não lê mais nada do host além do volume do relatório. v0.1.4 — projeto extraído do `llm-gateway` pra repositório próprio (mesmo app Umbrel,
  `bmfernandes-dev-audit`, mesmo comportamento — só o repositório de origem mudou).
  Mecanismo de deploy sem senha (sudoers + scripts fixos) reconstruído do zero,
  independente do `llm-gateway`. v0.1.3 — corrige o horário-alvo do agendamento:
  disparava às 01h local em vez das 04h locais que o comentário original alegava
  (`HORA_ALVO_PADRAO=4` era 4h UTC, não 4h local) — agora `HORA_ALVO_PADRAO=7` (UTC) = 04h
  America/Sao_Paulo de verdade. Verificado ao vivo o loop sleep→dispara-sozinho (vários
  ciclos consecutivos sem intervenção manual, inclusive resiliência a queda real do
  container). v0.1.2 — corrige dois achados reais da v0.1.1: SSH recusava rodar pro UID
  1000 sem entrada em `/etc/passwd`, e tentava gravar em `~/.ssh/known_hosts` num
  filesystem `read_only`. v0.1.1 — corrige sincronização do mirror git: a deploy key de
  leitura dedicada nunca era usada de fato (faltava `GIT_SSH_COMMAND`); clone/fetch agora
  autenticam com ela. v0.1.0 — primeira versão: verificação de integridade do host,
  sincronização de leitura do mirror git, escrita do relatório local e agendamento
  próprio (4h + jitter). Pipeline de fidelidade task↔código (herdado da TASK_V01 do
  llm-gateway) ainda não ligado a este app.
dependencies: []
