# Manifesto Umbrel Community App do LLM Gateway (TASK_V21/V23).
# CÓPIA DE REFERÊNCIA — a fonte que o Umbrel de fato lê é o repo público
# github.com/bmfernandes/umbrel-app-store (bmfernandes-llm-gateway/). Atualizar os dois em sincronia.
manifestVersion: 1
id: bmfernandes-llm-gateway
name: LLM Gateway
tagline: Inference-broker do homelab — gateway de texto OpenAI-compatible
icon: https://raw.githubusercontent.com/bmfernandes/umbrel-app-store/main/bmfernandes-llm-gateway/icon.svg
category: Developer Tools
# Casa com a versão do projeto (SemVer). Atualizar a cada release empacotado.
version: "0.14.0"
# Porta pública que o app_proxy escuta no host (faixa 80xx = app com UI, convenção AGENTS.md).
# O gateway-API interno segue em 8800 (88xx infra); o app_proxy faz proxy 8004 -> web:8800.
# AJUSTAR se colidir com outro app no Beelink (decisão empírica no deploy).
port: 8004
# A UI abre direto no dashboard admin read-only (co-servido pelo gateway, não é processo à parte).
path: "/dashboard"
description: >-
  Gateway de inferência de texto do homelab, compatível com a API OpenAI. Roteia por uma
  escada de tiers de qualidade que só desce (Groq em produção, Ollama como piso; Gemini,
  GPT-OSS e Claude como premium opt-in via pontes host-side). Inclui um dashboard de status
  admin read-only (saúde por tier, métricas e últimas requisições) e log de requisições
  durável para análise de uso. Os provedores reais ficam ocultos da API cliente (model:"gateway").
developer: BMFERNANDES
website: https://github.com/bmfernandes/llm-gateway
submitter: BMFERNANDES
repo: https://github.com/bmfernandes/llm-gateway
support: https://github.com/bmfernandes/llm-gateway/issues
gallery: []
releaseNotes: >-
  v0.14.0 — a troca automática de modelo (que já protegia o tier padrão de produção) passa a
  proteger também os tiers premium baseados no Gemini e no GPT-OSS: quando o Google descontinua
  uma versão de modelo em uso, o gateway escolhe sozinho um substituto da mesma família e
  qualidade, sem esperar edição manual nem derrubar o tier — o mesmo problema real que já
  aconteceu duas vezes com esses tiers específicos. v0.13.0 — quando um desses tiers premium rejeita um modelo descontinuado, isso deixa de ser um
  erro genérico e passa a ser detectado e registrado de forma clara (visível no painel e nos
  alertas), com a lista de modelos ainda disponíveis exposta junto. v0.12.1 — corrige dois bugs reais na cascata de tiers: uma falha de rate-limit no modelo
  alternativo do Groq (já escolhido pela troca automática) vazava como erro interno em vez de
  cair pro próximo tier disponível; e a URL alternativa do Ollama configurada no /setup nunca
  era aplicada de fato, sempre caindo no valor padrão. Corrige também o modelo padrão do tier
  Gemini Flash, descontinuado pelo Google (3.5 → 3.6), que estava derrubando as chamadas desse
  tier. v0.12.0 — quando a troca automática de modelo (v0.11.0) esgota as alternativas conhecidas, o
  gateway passa a consultar o catálogo de modelos ativos do Groq e escolher um candidato novo
  sozinho, sem esperar edição manual de arquivo. v0.11.0 — auto-cura de modelo: quando o Groq descontinua um modelo em uso, o gateway detecta
  o erro automaticamente, troca para uma alternativa configurada e notifica — sem derrubar o
  tier nem exigir intervenção manual. v0.10.5 — corrige o timeout curto da ponte agy que matava respostas longas (rascunho de task,
  revisão de código) antes de terminarem de gerar: todo processo do agy gasta ~10-29s obrigatórios
  de aquecimento (reautenticação, resolução de modelo) antes de começar a gerar, e o teto antigo
  de 30s cobria esse ciclo inteiro. Subido para 120s por tentativa, com o timeout externo do
  gateway ajustado junto para cobrir o pior caso das 3 tentativas de retry (362s) — os tiers
  Gemini/GPT-OSS voltam a completar respostas longas com sucesso. v0.10.4 — logging estruturado em todas as pontes e rotas do gateway (37 chamadas migradas para
  chave estável + campos nomeados); prompts de IA passam a viver em arquivo externo versionado
  (docs/prompts/) em vez de hardcoded no código, primeira aplicação da política "zero hardcoded
  prompts". Sem mudança de comportamento em produção. v0.10.3 — reduz o intervalo de keep-warm do CLI Claude de 24h para 6h (o token OAuth tem TTL
  observado de ~7,6h; o intervalo antigo deixava a renovação atrasada em relação à própria
  validade do token). v0.10.2 — troca flake8 por ruff/mypy (strict) na esteira de qualidade,
  sem mudança de comportamento em produção. v0.10.1 — pontes agy/Claude e o setup wizard passam a rodar como containers do próprio app
  (antes eram processos systemd --user no host, apagados a cada reboot da OS do Beelink) —
  recuperação após queda de energia volta a ser autônoma, sem SSH. Registry Docker interno
  também vira serviço do app, corrigindo mais um caso de perda ao reiniciar. v0.9.13 — tiers que dependem de pontes externas (Gemini, GPT-OSS, Claude) falhavam rápido só às
  vezes: um travamento de rede podia segurar a requisição por vários minutos antes de desistir.
  Agora falha em no máximo ~1min30s por tier antes de repassar adiante. v0.9.12 — corrige os tiers ultra/super/max (Gemini Pro, Gemini Flash, GPT-OSS), que devolviam
  erro de indisponibilidade: o catálogo do motor Gemini/GPT-OSS passou a exigir uma variante de
  qualidade explícita no modelo, e os identificadores antigos deixaram de existir. v0.9.11 — card "Requisições HTTP" do dashboard passa a contar só as rotas de cliente
  (`/v1/*`), sem inflar com o próprio acesso ao dashboard/métricas; resubmissão idêntica de
  segredos no /setup deixa de disparar reinício desnecessário do container; corrige o hash
  de senha para tratar salt vazio como valor real (não mais como ausente). v0.9.10 — coluna "Falhas" na tabela de tiers do dashboard, entre "Sucessos" e "Estado"
  (contagem de fallback por tier). v0.9.9 — número da versão do app aparece ao lado do nome no dashboard; gráfico de
  latência das últimas requisições (mínimo/média/máximo) acima do painel de tiers;
  script `bridge/test-tiers.sh` para testar os 6 tiers manualmente. Infra: linger
  reabilitado para o usuário do Beelink (pontes agy/Claude caíam junto ao fim de toda
  sessão SSH) e `OLLAMA_KEEP_ALIVE=24h` no Ollama do ubuntu-server (evita recarregar o
  modelo do zero a cada janela ociosa). v0.9.8 — corrige resolução de hostname Tailscale de dentro do container (DNS explícito),
  destravando o tier low de vez; rótulo "Groq" no dashboard vira "Groq (via api)". v0.9.7 —
  OLLAMA_URL vira campo configurável no /setup (tier low finalmente funciona em
  produção — antes ficava preso num placeholder fixo). v0.9.6 — tela de segredos do /setup
  pré-preenche o que já está salvo (chaves/tokens
  mascarados, últimos 4 caracteres reais) com ícone de status por campo. v0.9.5 — login do
  /setup passa a ser formulário próprio, não mais o diálogo do navegador
  (Basic Auth) — corrige falha real de autenticação com senha contendo acento/caractere
  especial. v0.9.4 — /setup vira dois passos: primeiro cria só a conta de administrador, depois (já
  autenticado) abre a tela de segredos — nunca os dois juntos. v0.9.3 — botão "Setup" na
  navegação do dashboard, ao lado de "Dashboard"/"JSON": antes o único jeito de chegar em
  /setup era digitar a URL manualmente. v0.9.2 — imagem passa a ser publicada
  num registry Docker privado no próprio Beelink em vez do GHCR (TASK_V26): o botão "Update" volta
  a funcionar sozinho, sem 401 nem recriação manual de container. Corrige também a hora exibida no
  dashboard (formatada no navegador de quem vê a tela, não mais no timezone do container). v0.9.0
  — setup wizard de segredos (tela "/setup" no próprio app): configure
  GATEWAY_SECRETS/GROQ_API_KEY/tokens de ponte direto pela UI no 1º acesso, sem precisar de
  variáveis de ambiente (o instalador do Umbrel não tem esse formulário). 1º acesso cria a conta
  de administrador; acessos seguintes exigem usuário/senha.
# Sem dependências de outros apps Umbrel: Ollama (server) e as pontes agy/claude são host-side,
# alcançados por Tailscale / host.docker.internal — não são apps do Umbrel.
dependencies: []
